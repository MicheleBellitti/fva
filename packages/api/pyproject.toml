[project]
name = "fva-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fva-core", "fva-assistant",
  "fastapi", "uvicorn[standard]", "sse-starlette",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/api"]
