[project]
name = "fva-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fva-core",
  "burr[start]", "anthropic", "openai", "google-genai", "httpx",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
