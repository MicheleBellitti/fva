[project]
name = "fva-perception"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fva-core",
  "sf-hamilton[visualization]", "av", "opencv-python-headless",
  "supervision", "numpy",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/perception"]
