[alembic]
# path to migration scripts — relative to this file
script_location = %(here)s/alembic

# prepend packages/core/src so that `import core` works inside env.py and migrations
prepend_sys_path = %(here)s/src

# URL overridden at runtime inside env.py from DATABASE_URL env-var.
# Keep a local default for convenience; production always sets the env-var.
sqlalchemy.url = postgresql+psycopg://fva:fva@localhost:5432/fva

# Naming template for generated revision files
file_template = %%(rev)s_%%(slug)s

# Truncate the slug to avoid overly long filenames
truncate_slug_length = 60

# === logging ===
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
