[alembic]
# path to migration scripts — relative to this file
script_location = %(here)s/alembic

# prepend packages/core/src so that `import core` works inside env.py and migrations
prepend_sys_path = %(here)s/src
path_separator = os

# No sqlalchemy.url here: env.py reads DATABASE_URL, with a local default.
# Setting sqlalchemy.url from code (e.g. a test fixture) takes precedence.

# Naming template for generated revision files
file_template = %%(rev)s_%%(slug)s

# Truncate the slug to avoid overly long filenames
truncate_slug_length = 60

# A generated revision must already pass CI's ruff checks.  Only import sorting is
# auto-fixed: a full --fix would drop `sa` and `op` from a still-empty revision.
[post_write_hooks]
hooks = ruff_imports, ruff_format
ruff_imports.type = module
ruff_imports.module = ruff
ruff_imports.options = check --fix --select I REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# === logging ===
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
