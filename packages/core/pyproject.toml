[project]
name = "fva-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9", "pydantic-settings>=2.6", "polars>=1.17",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.14",
  "boto3>=1.35", "pyyaml>=6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/core"]
